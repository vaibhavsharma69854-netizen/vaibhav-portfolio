<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="ugvBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080d1a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="cyanAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <filter id="ugvGlow">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="800" height="450" fill="url(#ugvBg)" rx="12" />

  <!-- Grid Blueprint Background -->
  <g stroke="rgba(0, 240, 255, 0.06)" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="450" />
    <line x1="200" y1="0" x2="200" y2="450" />
    <line x1="300" y1="0" x2="300" y2="450" />
    <line x1="400" y1="0" x2="400" y2="450" />
    <line x1="500" y1="0" x2="500" y2="450" />
    <line x1="600" y1="0" x2="600" y2="450" />
    <line x1="700" y1="0" x2="700" y2="450" />
    
    <line x1="0" y1="80" x2="800" y2="80" />
    <line x1="0" y1="160" x2="800" y2="160" />
    <line x1="0" y1="240" x2="800" y2="240" />
    <line x1="0" y1="320" x2="800" y2="320" />
    <line x1="0" y1="400" x2="800" y2="400" />
  </g>

  <!-- Autonomous UGV Schematic Illustration -->
  <g transform="translate(400, 220)">
    <!-- Vision Ray Cones (FOV) -->
    <path d="M0 -45 L-220 -180 L220 -180 Z" fill="url(#cyanAccent)" opacity="0.12" />
    <line x1="0" y1="-45" x2="-220" y2="-180" stroke="#00f0ff" stroke-width="1.5" stroke-dasharray="6 4" opacity="0.6" />
    <line x1="0" y1="-45" x2="220" y2="-180" stroke="#00f0ff" stroke-width="1.5" stroke-dasharray="6 4" opacity="0.6" />
    <line x1="0" y1="-45" x2="0" y2="-180" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.8" />
    
    <!-- Target Bounding Box in FOV -->
    <rect x="-60" y="-150" width="120" height="40" fill="none" stroke="#00f0ff" stroke-width="1.5" stroke-dasharray="4 3" />
    <text x="0" y="-125" font-family="monospace" font-size="10" fill="#00f0ff" text-anchor="middle">OBSTACLE_DETECTED [d=1.42m]</text>

    <!-- 4WD Wheels -->
    <rect x="-140" y="-85" width="30" height="60" rx="6" fill="#1e293b" stroke="#00f0ff" stroke-width="1.5" />
    <rect x="110" y="-85" width="30" height="60" rx="6" fill="#1e293b" stroke="#00f0ff" stroke-width="1.5" />
    <rect x="-140" y="25" width="30" height="60" rx="6" fill="#1e293b" stroke="#00f0ff" stroke-width="1.5" />
    <rect x="110" y="25" width="30" height="60" rx="6" fill="#1e293b" stroke="#00f0ff" stroke-width="1.5" />

    <!-- UGV Main Chassis Body -->
    <rect x="-105" y="-70" width="210" height="140" rx="16" fill="#0f172a" stroke="#3b82f6" stroke-width="2" />
    
    <!-- Internal Electronics & Compute Module -->
    <rect x="-70" y="-45" width="140" height="90" rx="8" fill="#1e293b" stroke="rgba(0,240,255,0.4)" stroke-width="1" />
    <rect x="-45" y="-30" width="90" height="60" rx="4" fill="#020617" stroke="#00f0ff" stroke-width="1.5" />
    
    <!-- Microcontroller Chip Indicator -->
    <text x="0" y="5" font-family="monospace" font-size="10" fill="#00f0ff" text-anchor="middle" font-weight="bold">AI VISION CORE</text>
    <text x="0" y="20" font-family="monospace" font-size="8" fill="#94a3b8" text-anchor="middle">OPENCV + ARDUINO</text>

    <!-- Front Optical Camera Sensor Mount -->
    <circle cx="0" cy="-70" r="14" fill="#020617" stroke="#00f0ff" stroke-width="2" />
    <circle cx="0" cy="-70" r="6" fill="#00f0ff" filter="url(#ugvGlow)" />
    
    <!-- Ultrasonic Range Finders -->
    <circle cx="-60" cy="-70" r="8" fill="#1e293b" stroke="#3b82f6" stroke-width="1" />
    <circle cx="60" cy="-70" r="8" fill="#1e293b" stroke="#3b82f6" stroke-width="1" />
  </g>

  <!-- HUD Telemetry Labels -->
  <g font-family="monospace" font-size="11" fill="#94a3b8">
    <text x="30" y="45" fill="#00f0ff">&gt; SYSTEM: VISION-BASED AUTONOMOUS UGV</text>
    <text x="30" y="65">&gt; STATUS: IN_DEVELOPMENT // ACTIVE</text>
    <text x="770" y="45" text-anchor="end" fill="#10b981">&gt; FPS: 32.4 | LATENCY: 38ms</text>
  </g>
</svg>
