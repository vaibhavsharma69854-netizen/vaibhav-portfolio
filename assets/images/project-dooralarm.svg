<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="doorBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a121d" />
      <stop offset="100%" stop-color="#020610" />
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#doorBg)" rx="12" />

  <!-- Grid Blueprint Background -->
  <g stroke="rgba(0, 240, 255, 0.07)" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="450" />
    <line x1="200" y1="0" x2="200" y2="450" />
    <line x1="300" y1="0" x2="300" y2="450" />
    <line x1="400" y1="0" x2="400" y2="450" />
    <line x1="500" y1="0" x2="500" y2="450" />
    <line x1="600" y1="0" x2="600" y2="450" />
    <line x1="700" y1="0" x2="700" y2="450" />
  </g>

  <!-- Smart Door Alarm Proximity Radar Illustration -->
  <g transform="translate(400, 225)">
    <!-- Door Frame Outline -->
    <rect x="-240" y="-120" width="120" height="240" rx="4" fill="#0f172a" stroke="#475569" stroke-width="2" />
    <line x1="-120" y1="-120" x2="-120" y2="120" stroke="#00f0ff" stroke-width="2" />

    <!-- Alarm Sensor Unit Mounted on Door Header -->
    <rect x="-135" y="-100" width="30" height="50" rx="4" fill="#1e293b" stroke="#00f0ff" stroke-width="1.5" />
    <circle cx="-120" cy="-85" r="5" fill="#ef4444" />
    <circle cx="-120" cy="-65" r="4" fill="#00f0ff" />

    <!-- 3-Tier Distance Concentric Radar Arcs -->
    <!-- Zone 3: Safe Area (Blue) -->
    <path d="M-120 -85 A 280 280 0 0 1 180 10" fill="none" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="4 6" opacity="0.6" />
    <text x="110" y="-20" font-family="monospace" font-size="9" fill="#3b82f6">ZONE 3: SAFE (>150cm)</text>

    <!-- Zone 2: Proximity Alert (Yellow) -->
    <path d="M-120 -85 A 180 180 0 0 1 80 -10" fill="none" stroke="#f59e0b" stroke-width="2" stroke-dasharray="4 4" opacity="0.8" />
    <text x="50" y="-80" font-family="monospace" font-size="9" fill="#f59e0b">ZONE 2: WARN (50-150cm)</text>

    <!-- Zone 1: Critical Intrusion Breach (Red) -->
    <path d="M-120 -85 A 90 90 0 0 1 -20 -40" fill="none" stroke="#ef4444" stroke-width="2.5" />
    <text x="-5" y="-120" font-family="monospace" font-size="9" fill="#ef4444" font-weight="bold">ZONE 1: BREACH ALARM (&lt;50cm)</text>

    <!-- Approaching Target Vector Indicator -->
    <circle cx="20" cy="50" r="16" fill="rgba(239, 68, 68, 0.2)" stroke="#ef4444" stroke-width="1.5" />
    <circle cx="20" cy="50" r="4" fill="#ef4444" />
    <line x1="20" y1="50" x2="-80" y2="-60" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="3 3" />
  </g>

  <!-- Telemetry Header -->
  <g font-family="monospace" font-size="11" fill="#94a3b8">
    <text x="30" y="45" fill="#ef4444">&gt; SYSTEM: SMART DOOR PROXIMITY ALARM</text>
    <text x="30" y="65">&gt; PROTOCOL: MULTI-TIER ACOUSTIC TIME-OF-FLIGHT ESCALATION</text>
    <text x="770" y="45" text-anchor="end" fill="#00f0ff">&gt; LATENCY: &lt;50ms</text>
  </g>
</svg>
